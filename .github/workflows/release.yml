name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  # ===========================================================================
  # Linux Builds (.deb + .tar.gz with install.sh + AppImage)
  # ===========================================================================
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lld clang pkg-config libfontconfig1-dev libfreetype-dev \
            libasound2-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev \
            libssl-dev libdbus-1-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install cargo-deb & appimagetool
        run: |
          cargo install cargo-deb --locked
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Multi-Platform Linux Packaging Script
        run: |
          if [ -f "./scripts/package.sh" ]; then
            chmod +x ./scripts/package.sh
            ./scripts/package.sh
          elif [ -f "./package.sh" ]; then
            chmod +x ./package.sh
            ./package.sh
          else
            echo "HATA: package.sh bulunamadı!"
            exit 1
          fi

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum ytm-hybrid-v*-linux-x64.tar.gz YTM_Hybrid-v*-x86_64.AppImage > SHA256SUMS-linux.txt 2>/dev/null || true
          if [ -d "../target/debian" ]; then
            cd ../target/debian
            sha256sum ytm-hybrid_*.deb >> ../../dist/SHA256SUMS-linux.txt 2>/dev/null || true
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            target/debian/*.deb
            dist/SHA256SUMS-linux.txt

  # ===========================================================================
  # Windows Build (ZIP, MSIX, Inno Setup .exe, Portable .exe, and install-msix.bat)
  # ===========================================================================
  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Add Windows SDK to PATH
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64" -Directory -ErrorAction SilentlyContinue |
                    Sort-Object Name -Descending |
                    Select-Object -First 1
          if ($sdkBin) {
            echo "Windows SDK bulundu: $($sdkBin.FullName)"
            "$($sdkBin.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Warning "Windows SDK x64 bin dizini bulunamadı!"
          }

      - name: Run Windows Packaging Script (ZIP, MSIX, Portable)
        shell: pwsh
        run: |
          if (Test-Path ".\scripts\package-windows.ps1") {
              .\scripts\package-windows.ps1 -Version "0.4.3" -Build
          } elseif (Test-Path ".\package-windows.ps1") {
              .\package-windows.ps1 -Version "0.4.3" -Build
          } elseif (Test-Path ".\packaging\package-windows.ps1") {
              .\packaging\package-windows.ps1 -Version "0.4.3" -Build
          } else {
              throw "package-windows.ps1 bulunamadı!"
          }

      - - name: Compile Inno Setup Installer (.exe)
          uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
          with:
          path: scripts/windows/ytmhybrid.iss
          options: /DSourcePath=..\..\target\release /DAppVersion=0.4.3 /DOutputDir=dist

      - name: Copy install-msix.bat to dist
        shell: pwsh
        run: |
          if (Test-Path "scripts\windows\install-msix.bat") {
              Copy-Item "scripts\windows\install-msix.bat" -Destination "dist\"
              Write-Host "install-msix.bat dist/ klasörüne kopyalandı."
          } else {
              Write-Warning "scripts/windows/install-msix.bat bulunamadı!"
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          cd dist
          $files = Get-ChildItem -File -Exclude "SHA256SUMS*"
          $files | ForEach-Object {
              $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
          } | Out-File -FilePath "SHA256SUMS-windows.txt" -Encoding utf8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.zip
            dist/*.msix
            dist/*.exe
            dist/*.bat
            dist/SHA256SUMS-windows.txt

  # ===========================================================================
  # macOS Build (.app bundle + .dmg)
  # ===========================================================================
  build-macos:
    name: Build macOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install create-dmg & cargo-bundle
        run: |
          brew install create-dmg
          cargo install cargo-bundle --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary & create DMG
        run: |
          cargo build --release --package ytm-hybrid
          if [ -f "./packaging/macos/build-dmg.sh" ]; then
            chmod +x ./packaging/macos/build-dmg.sh
            ./packaging/macos/build-dmg.sh
          else
            cargo bundle --release
            mkdir -p dist
            BUNDLE_DIR="target/release/bundle/osx"
            [ ! -d "$BUNDLE_DIR" ] && BUNDLE_DIR="target/release/bundle/macos"
            APP_PATH=$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.app" | head -n 1)
            APP_NAME=$(basename "$APP_PATH")
            DMG_PATH="dist/YTM_Hybrid-v0.4.3-x64.dmg"
            rm -f "$DMG_PATH"
            create-dmg \
              --volname "YTM Hybrid" \
              --window-size 600 400 \
              --icon-size 80 \
              --icon "$APP_NAME" 180 190 \
              --app-drop-link 420 190 \
              "$DMG_PATH" \
              "$BUNDLE_DIR/" || hdiutil create -volname "YTM Hybrid" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
          fi

      - name: Generate SHA256 checksum
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS-macos.txt 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.msix" -o -name "*.dmg" -o -name "*.exe" -o -name "*.bat" \) -exec cp {} release-assets/ \;
          cat artifacts/*/SHA256SUMS-*.txt > release-assets/SHA256SUMS.txt 2>/dev/null || true

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.4.3" >> $GITHUB_OUTPUT
          fi

      - name: Create Release Notes
        run: |
          sed 's/^          //' << 'EOF' > RELEASE_NOTES.md
          ## What's New in v0.4.3

          ### 🎛️ Spatial Audio & Equalizer Enhancements
          - **Advanced Spatial Audio Modes**: Implemented acoustic stage profiles including *Subtle (Meier)*, *Studio (Monitors)*, *Front Stage (HRTF)*, *3D Surround (Wide)*, and *3D Concert Hall*.
          - **Custom Equalizer Presets**: Integrated custom tuning presets for *Harman IEM*, *Phonk*, and *Hip-Hop*.

          ### 🌐 Localization & UI Improvements
          - **Multi-Language Support Expansion**: Added comprehensive localization (.ftl files) for English, Turkish, German, Spanish, French, Italian, Indonesian, Japanese, Russian, Ukrainian, Polish, Czech, Portuguese (Brazil), Simplified Chinese, and Albanian.

          ### 🛠️ CI/CD & Windows Inno Setup
          - **Automated Inno Setup Installer**: Integrated GitHub Actions CI pipeline with Inno Setup to automatically build and compile professional Windows setup executables (`YTMHybrid-v0.4.3-Setup.exe`).

          ---

          ## Installation

          ### Windows
          - **Setup Installer (.exe)**: `YTMHybrid-v0.4.3-Setup.exe` (Recommended)
          - **Portable Executable (.exe)**: `ytm-hybrid.exe` (Standalone portable binary)
          - **Automated ZIP Archive**: `ytm-hybrid-v0.4.3-windows-x64.zip`
          - **MSIX Package**: Download both `ytm-hybrid-v0.4.3-windows-x64.msix` and `install-msix.bat` into the same folder, then double-click `install-msix.bat` to automatically trust the self-signed certificate and install the app. *(Note: Make sure your Windows system clock is synced if you encounter a certificate time error.)*

          ### Linux
          - **Debian / Ubuntu / Mint (.deb)**: `ytm-hybrid_0.4.3-1_amd64.deb`
          - **Generic Tarball (.tar.gz)**: `ytm-hybrid-v0.4.3-linux-x64.tar.gz`
          - **AppImage**: `YTM_Hybrid-v0.4.3-x86_64.AppImage`

          ### macOS
          - **Disk Image (.dmg)**: `YTM-Hybrid-0.4.3-macOS.dmg`

          ---

          **Full Changelog**: [v0.4.2...v0.4.3](https://github.com/egehansimarikk/YtmHybridClient/compare/v0.4.2...v0.4.3)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: YTM Hybrid v${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}