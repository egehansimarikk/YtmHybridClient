name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="${GITHUB_SHA:0:7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Ensure Xcode command line tools are installed
          xcode-select --install || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: Build ytm-hybrid release binary
        run: cargo build --release --locked --package ytm-hybrid --target ${{ matrix.target }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Stage the executable
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp \
            "target/$TARGET/release/ytm-hybrid" \
            "dist/ytm-hybrid-$VERSION-$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: "ytm-hybrid-${{ matrix.target }}"
          path: dist/*
          if-no-files-found: error

  # Linux bundles: .deb, .AppImage, .tar.gz
  linux-bundles:
    name: Linux bundles (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              version="$GITHUB_REF_NAME"
              number="${GITHUB_REF_NAME#v}"
              ;;
            *)
              version="${GITHUB_SHA:0:7}"
              number=""
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: "ytm-hybrid-${{ matrix.target }}"
          path: staged

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Install appimagetool
        run: |
          set -euo pipefail
          base=https://github.com/AppImage/appimagetool/releases/download/continuous
          curl -fsSL -o appimagetool "$base/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Build .deb package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NUMBER: ${{ steps.meta.outputs.number }}
        run: |
          set -euo pipefail
          cargo deb --package ytm-hybrid --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/debian/ytm-hybrid_${NUMBER}-1_${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'amd64' || 'arm64' }}.deb" "dist/ytm-hybrid-$VERSION-${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'x86_64' || 'aarch64' }}.deb"

      - name: Build AppImage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NUMBER: ${{ steps.meta.outputs.number }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp "staged/ytm-hybrid-$VERSION-$TARGET" AppDir/usr/bin/ytm-hybrid
          chmod +x AppDir/usr/bin/ytm-hybrid
          cp assets/linux/icons/hicolor/256x256/apps/ytm-hybrid.png AppDir/usr/share/icons/hicolor/256x256/apps/
          mkdir -p AppDir/usr/share/applications
          cp assets/linux/ytm-hybrid.desktop AppDir/usr/share/applications/

          ./appimagetool --appdir AppDir --updater-information gh-releases-zsync|${{ github.repository }}|${{ github.event.repository.name }}|latest|ytm-hybrid-${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'x86_64' || 'aarch64' }}.AppImage.zsync dist/ytm-hybrid-$VERSION-${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'x86_64' || 'aarch64' }}.AppImage

      - name: Build portable .tar.gz archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p portable
          cp "staged/ytm-hybrid-$VERSION-$TARGET" portable/ytm-hybrid
          chmod +x portable/ytm-hybrid
          # Include desktop file and icon
          mkdir -p portable/usr/share/applications portable/usr/share/icons/hicolor/256x256/apps
          cp assets/linux/ytm-hybrid.desktop portable/usr/share/applications/
          cp assets/linux/icons/hicolor/256x256/apps/ytm-hybrid.png portable/usr/share/icons/hicolor/256x256/apps/
          tar -czf "dist/ytm-hybrid-$VERSION-${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'x86_64' || 'aarch64' }}.tar.gz" -C portable .

      - uses: actions/upload-artifact@v4
        with:
          name: "linux-bundles-${{ matrix.target }}"
          path: dist/*
          if-no-files-found: error

  # macOS bundle: .dmg
  macos-bundle:
    name: macOS bundle
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              version="$GITHUB_REF_NAME"
              number="${GITHUB_REF_NAME#v}"
              ;;
            *)
              version="${GITHUB_SHA:0:7}"
              number="0.0.0"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: ytm-hybrid-*-apple-darwin
          path: darwin
          merge-multiple: true

      - name: Assemble the app bundle
        shell: bash
        env:
          NUMBER: ${{ steps.meta.outputs.number }}
        run: |
          set -euo pipefail

          mkdir -p \
            ytm-hybrid.app/Contents/MacOS \
            ytm-hybrid.app/Contents/Resources

          lipo -create \
            -output ytm-hybrid.app/Contents/MacOS/ytm-hybrid \
            darwin/ytm-hybrid-aarch64-apple-darwin \
            darwin/ytm-hybrid-x86_64-apple-darwin
          chmod +x ytm-hybrid.app/Contents/MacOS/ytm-hybrid
          lipo -info ytm-hybrid.app/Contents/MacOS/ytm-hybrid

          cp \
            assets/macos/icon.icns \
            ytm-hybrid.app/Contents/Resources/

          cp \
            assets/macos/Info.plist \
            ytm-hybrid.app/Contents/

          sed \
            -i '' "s/@VERSION@/$NUMBER/g" \
            ytm-hybrid.app/Contents/Info.plist

      - name: Create the disk image (.dmg)
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp -R ytm-hybrid.app staging/
          ln -s /Applications staging/Applications
          megabytes=$(du -ms staging | cut -f1)
          hdiutil create \
            -volname ytm-hybrid \
            -srcfolder staging \
            -size "$((megabytes + 128))m" \
            -ov \
            -format UDZO \
            "dist/ytm-hybrid-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: "ytm-hybrid-macos"
          path: dist/*
          if-no-files-found: error

  release:
    needs: [linux-bundles, macos-bundle]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: ytm-hybrid-*
          path: dist
          merge-multiple: true

      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          pattern: linux-bundles-*
          path: dist
          merge-multiple: true

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
