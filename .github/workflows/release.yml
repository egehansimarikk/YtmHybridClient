name: Release Build

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             lld             clang             pkg-config             libfontconfig1-dev             libfreetype-dev             libasound2-dev             libwayland-dev             libxkbcommon-dev             libxkbcommon-x11-dev             libx11-xcb-dev             libxcb-render0-dev             libxcb-shape0-dev             libxcb-xfixes0-dev             libvulkan-dev             libssl-dev             libdbus-1-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --package ytm-hybrid

      - name: Verify build
        run: |
          test -x ./target/release/ytm-hybrid
          ls -lh ./target/release/ytm-hybrid

      - name: Build .deb package
        run: cargo deb --no-build --package ytm-hybrid

      - name: Create .tar.gz with install.sh
        run: |
          chmod +x ./package.sh
          ./package.sh

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum ytm-hybrid-v*-linux-x64.tar.gz > SHA256SUMS-linux.txt
          cd ../target/debian
          sha256sum ytm-hybrid_*.deb >> ../../dist/SHA256SUMS-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/ytm-hybrid-v*-linux-x64.tar.gz
            target/debian/ytm-hybrid_*.deb
            dist/SHA256SUMS-linux.txt

  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --package ytm-hybrid

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "targetelease\ytm-hybrid.exe")) {
            Write-Error "ytm-hybrid.exe not found!"
            exit 1
          }
          Get-Item "targetelease\ytm-hybrid.exe"

      - name: Create Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "targetelease\ytm-hybrid.exe" -Destination "dist" -Force
          Copy-Item -Path "LICENSE" -Destination "dist" -Force

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\ytm-hybrid.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  ytm-hybrid.exe" | Out-File -FilePath "dist\SHA256SUMS-windows.txt" -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/ytm-hybrid.exe
            dist/LICENSE
            dist/SHA256SUMS-windows.txt

  build-macos:
    name: Build macOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --package ytm-hybrid

      - name: Verify build
        run: |
          test -x ./target/release/ytm-hybrid
          ls -lh ./target/release/ytm-hybrid

      - name: Create .app bundle and .dmg
        run: |
          chmod +x ./packaging/macos/build-dmg.sh
          ./packaging/macos/build-dmg.sh

      - name: Generate SHA256 checksum
        run: |
          cd dist
          shasum -a 256 YTM-Hybrid-*.dmg > SHA256SUMS-macos.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            dist/YTM-Hybrid-*.dmg
            dist/SHA256SUMS-macos.txt

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/linux-packages/*.tar.gz release-assets/ || true
          cp artifacts/linux-packages/*.deb release-assets/ || true
          cp artifacts/linux-packages/SHA256SUMS-linux.txt release-assets/ || true
          cp artifacts/windows-package/ytm-hybrid.exe release-assets/ || true
          cp artifacts/windows-package/SHA256SUMS-windows.txt release-assets/ || true
          cp artifacts/macos-package/*.dmg release-assets/ || true
          cp artifacts/macos-package/SHA256SUMS-macos.txt release-assets/ || true
          cat artifacts/*/SHA256SUMS-*.txt > release-assets/SHA256SUMS.txt || true

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: YTM Hybrid v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
