name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================================================
  # Linux Builds (.deb + .tar.gz with install.sh)
  # ===========================================================================
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lld clang pkg-config libfontconfig1-dev libfreetype-dev \
            libasound2-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev \
            libssl-dev libdbus-1-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --package ytm-hybrid

      - name: Verify build
        run: |
          test -x ./target/release/ytm-hybrid
          ls -lh ./target/release/ytm-hybrid

      - name: Build .deb package
        run: cargo deb --no-build --package ytm-hybrid

      - name: Create .tar.gz with install.sh
        run: |
          chmod +x ./package.sh
          ./package.sh

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum ytm-hybrid-v*-linux-x64.tar.gz > SHA256SUMS-linux.txt
          cd ../target/debian
          sha256sum ytm-hybrid_*.deb >> ../../dist/SHA256SUMS-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/ytm-hybrid-v*-linux-x64.tar.gz
            target/debian/ytm-hybrid_*.deb
            dist/SHA256SUMS-linux.txt

  # ===========================================================================
  # Windows Build
  # ===========================================================================
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --package ytm-hybrid

      - name: Verify build
        run: |
          Test-Path .\target\release\ytm-hybrid.exe
          Get-ChildItem .\target\release\ytm-hybrid.exe

      - name: Create Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "target\release\ytm-hybrid.exe" -Destination "dist\" -Force
          Copy-Item -Path "LICENSE" -Destination "dist\" -Force

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\ytm-hybrid.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash ytm-hybrid.exe" | Out-File -FilePath "dist\SHA256SUMS-windows.txt" -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/ytm-hybrid.exe
            dist/LICENSE
            dist/SHA256SUMS-windows.txt

  # ===========================================================================
  # macOS Build (.app bundle + .dmg)
  # ===========================================================================
  build-macos:
    name: Build macOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --package ytm-hybrid

      - name: Verify build
        run: |
          test -x ./target/release/ytm-hybrid
          ls -lh ./target/release/ytm-hybrid

      - name: Create .app bundle and .dmg
        run: |
          chmod +x ./packaging/macos/build-dmg.sh
          ./packaging/macos/build-dmg.sh

      - name: Generate SHA256 checksum
        run: |
          cd dist
          shasum -a 256 YTM-Hybrid-*.dmg > SHA256SUMS-macos.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            dist/YTM-Hybrid-*.dmg
            dist/SHA256SUMS-macos.txt

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir release-assets
          # Linux packages - try dist/ subdirectory first, then root
          cp artifacts/linux-packages/dist/*.tar.gz release-assets/ 2>/dev/null || cp artifacts/linux-packages/*.tar.gz release-assets/ || true
          cp artifacts/linux-packages/target/debian/*.deb release-assets/ 2>/dev/null || cp artifacts/linux-packages/*.deb release-assets/ || true
          cp artifacts/linux-packages/dist/SHA256SUMS-linux.txt release-assets/ 2>/dev/null || cp artifacts/linux-packages/SHA256SUMS-linux.txt release-assets/ || true
          # Windows package - try dist/ subdirectory first, then root
          cp artifacts/windows-package/dist/ytm-hybrid.exe release-assets/ 2>/dev/null || cp artifacts/windows-package/ytm-hybrid.exe release-assets/ || true
          cp artifacts/windows-package/dist/SHA256SUMS-windows.txt release-assets/ 2>/dev/null || cp artifacts/windows-package/SHA256SUMS-windows.txt release-assets/ || true
          # macOS package - try dist/ subdirectory first, then root
          cp artifacts/macos-package/dist/*.dmg release-assets/ 2>/dev/null || cp artifacts/macos-package/*.dmg release-assets/ || true
          cp artifacts/macos-package/dist/SHA256SUMS-macos.txt release-assets/ 2>/dev/null || cp artifacts/macos-package/SHA256SUMS-macos.txt release-assets/ || true
          # Combine all checksums
          cat artifacts/*/SHA256SUMS-*.txt artifacts/*/dist/SHA256SUMS-*.txt > release-assets/SHA256SUMS.txt 2>/dev/null || true

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.4.2" >> $GITHUB_OUTPUT
          fi

      - name: Create Release Notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## What's New in v0.4.2

          ### 🎛️ Audio Engine & Device Management
          - **Refined 3D Soundstage & Acoustic Modes**: Overhauled the spatial audio engine in `crates/music/src/spatial.rs` with tuned Bauer crossfeed (bs2b), sub-bass mono anchoring, Mid/Side air expansion, and distinct multi-tap acoustic reflection models for *Studio*, *Wide Stage*, and *Concert Hall**).
          - **Clean Output Device Selection**: Filtered out redundant virtual drivers, ALSA/Pulse/PipeWire plugin clutter, and duplicate card entries in `crates/music/src/audio.rs` so only clean hardware sinks and system defaults appear.
          - **Streamlined Hardware List**: Improved usability and reliability when switching audio output devices on Linux and desktop environments.

          ### 🌍 Localization & i18n
          - **Expanded Language Support**: Resolved missing localization keys for audio output and spatial audio settings across supported locales.
          - **UI Consistency**: Standardized translated labels across settings and player views.

          ### ⚙️ Architecture & View Stability
          - **Global State Migration**: Standardized global state references from legacy `Sonora` identifiers to `YtmHybrid` across `crates/state` and `crates/views` (`root.rs`, `player_bar.rs`, `notice.rs`, `fullscreen.rs`).
          - **Synced Lyrics Rendering Fix**: Fixed secondary lyrics lane timing variable resolution in `crates/views/src/chrome/aside.rs`.

          ### 🛠️ CI/CD & Packaging
          - **Release Workflow Alignment**: Updated `.github/workflows/release.yml` artifact packaging, checksum aggregation, and release notes generation for `v0.4.2`.

          ---

          ## Installation

          ### Windows
          - **Installer (Recommended)**: [`ytm-hybrid-Setup.exe`](https://github.com/egehansimarikk/YtmHybridClient/releases/latest/download/ytm-hybrid-Setup.exe) (Includes Start Menu shortcuts and automated protocol registration).
          - **Executable (Portable)**: [`ytm-hybrid.exe`](https://github.com/egehansimarikk/YtmHybridClient/releases/download/v0.4.2/ytm-hybrid.exe)

          ### Linux
          - **Debian / Ubuntu / Mint (.deb)**: [`ytm-hybrid_0.4.2_amd64.deb`](https://github.com/egehansimarikk/YtmHybridClient/releases/download/v0.4.2/ytm-hybrid_0.4.2_amd64.deb)
          - **Generic Tarball (.tar.gz)**: [`ytm-hybrid-v0.4.2-linux-x64.tar.gz`](https://github.com/egehansimarikk/YtmHybridClient/releases/download/v0.4.2/ytm-hybrid-v0.4.2-linux-x64.tar.gz) (Includes `install.sh` for `~/.local/bin` deployment and desktop integration)

          ### macOS
          - **Disk Image (.dmg)**: [`YTM-Hybrid-0.4.2-macOS.dmg`](https://github.com/egehansimarikk/YtmHybridClient/releases/download/v0.4.2/YTM-Hybrid-0.4.2-macOS.dmg)

          ---

          ## Verify Downloads
          SHA256 checksum files (`SHA256SUMS.txt`, `SHA256SUMS-linux.txt`, `SHA256SUMS-windows.txt`, `SHA256SUMS-macos.txt`) are attached to verify archive and binary integrity.

          ---

          **Full Changelog**: [v0.4.0...v0.4.2](https://github.com/egehansimarikk/YtmHybridClient/compare/v0.4.0...v0.4.2)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: YTM Hybrid v${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}