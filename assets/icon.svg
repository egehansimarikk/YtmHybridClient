<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- YTM Hybrid logo: YouTube Music style with play button in rounded square -->
  <defs>
    <linearGradient id="ytm-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="64" y="64" width="384" height="384" rx="96" fill="url(#ytm-gradient)"/>

  <!-- White play button circle -->
  <circle cx="256" cy="256" r="120" fill="white"/>

  <!-- Red play triangle -->
  <path d="M 226 206 L 226 306 L 306 256 Z" fill="#FF0000"/>
</svg>
